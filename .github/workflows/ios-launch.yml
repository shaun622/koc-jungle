name: iOS 27 native launch diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm exec -- cap sync ios
      - run: node scripts/run-ios-launch-tests.mjs ipad
      - name: Export native evidence
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path ios-launch-results/ipad/Launch.xcresult --format json
          xcrun xcresulttool export attachments --path ios-launch-results/ipad/Launch.xcresult --output-path exported
          xcrun xcresulttool export diagnostics --path ios-launch-results/ipad/Launch.xcresult --output-path exported/diagnostics
          find exported -name 'StandardOutputAndStandardError-com.koc.padel.txt' -exec grep -E 'PAD_LAUNCH|⚡️|JavaScript|Error:|Unable to load' {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-launch-diagnosis
          path: |
            exported/
            ios-launch-results/ipad/environment.json
          retention-days: 7
