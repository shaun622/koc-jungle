name: iOS 27 clean release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: padel-ios-launch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  launch:
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        family: [iphone, ipad]
    env:
      COCOAPODS_DISABLE_STATS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/check-ios-build-env.mjs
      - run: node scripts/check-ios-scene.mjs
      - run: npm run build
      - run: npm exec -- cap sync ios
      - name: Launch the actual release-mode app on iOS 27
        run: node scripts/run-ios-launch-tests.mjs ${{ matrix.family }}
      - name: Export readable test evidence
        if: always()
        env:
          TEST_FAMILY: ${{ matrix.family }}
        run: |
          RESULT="ios-launch-results/$TEST_FAMILY/Launch.xcresult"
          if [ -d "$RESULT" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULT" --format json
            xcrun xcresulttool export attachments --path "$RESULT" --output-path "ios-launch-results/$TEST_FAMILY/attachments"
            xcrun xcresulttool export diagnostics --path "$RESULT" --output-path "ios-launch-results/$TEST_FAMILY/diagnostics"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-launch-${{ matrix.family }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: ios-launch-results/

# No signing credentials, reviewer accounts, purchases or production event writes.
# XCTest drives the real bundled WKWebView. This job is a gate for submission,
# not evidence of Apple review or physical-device/AirPlay testing.
