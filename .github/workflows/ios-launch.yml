name: iOS 27 native launch diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios27-launch-iphone-9e1fb881ce71e09000a3bc609b82dbf4d168a6f1
          run-id: 43690824075
          github-token: ${{ github.token }}
          path: results
      - name: Export native failure evidence
        run: |
          xcrun xcresulttool get test-results summary --path results/iphone/Launch.xcresult --format json
          xcrun xcresulttool export attachments --path results/iphone/Launch.xcresult --output-path exported
          xcrun xcresulttool export diagnostics --path results/iphone/Launch.xcresult --output-path exported/diagnostics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios27-readable-diagnostics
          path: exported/
          retention-days: 7
